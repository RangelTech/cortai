<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meus cortes · Cortaí</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23ff3d6e'/><path d='M22 18l24 14-24 14z' fill='white'/></svg>">
<link rel="stylesheet" href="/s/estilo.css">
<link rel="stylesheet" href="/s/painel.css">
</head>
<body>
<header class="topo"><div class="wrap">
  <a class="marca" href="/painel">Cort<span>aí</span></a>
  <nav><span id="cota" class="cota"></span><button class="btn btn-sec" id="ver-tour" onclick="SBTour.abrir()">Tour</button><button class="btn btn-sec" id="sair">Sair</button></nav>
</div></header>
<main class="wrap painel">
  <div id="aviso-assinar" class="faixa" hidden></div>
  <section class="novo">
    <div class="abas" role="tablist">
      <button class="aba on" role="tab" aria-selected="true" data-aba="link">Cortes de um link</button>
      <button class="aba" role="tab" data-aba="texto">Animação por texto</button>
      <button class="aba" role="tab" data-aba="reels">Clonar Reels</button>
    </div>
    <form id="f-link" class="form-link">
      <input id="url" type="url" required placeholder="Cole aqui o link do vídeo (YouTube, Instagram, TikTok…)" autocomplete="off">
      <select id="quantos" aria-label="Quantos cortes"><option value="3">3 cortes</option><option value="1">1 corte</option><option value="2">2 cortes</option><option value="4">4 cortes</option><option value="5">5 cortes</option></select>
      <button class="btn btn-pri" type="submit">Gerar cortes</button>
    </form>
    <form id="f-texto" class="form-texto" hidden>
      <textarea id="texto" rows="3" maxlength="1500" required placeholder="Ex.: curiosidade sobre por que o céu é azul, estilo canal dark, termina pedindo para seguir"></textarea>
      <div class="linha-op">
        <select id="segundos" aria-label="Duração"><option value="30">30 segundos</option><option value="15">15 segundos</option><option value="45">45 segundos</option><option value="60">60 segundos</option></select>
        <select id="voz" aria-label="Voz do narrador"><option value="feminina">Voz feminina</option><option value="masculina">Voz masculina</option></select>
        <button class="btn btn-pri" type="submit">Criar animação</button>
      </div>
    </form>
    <form id="f-clonar" class="form-texto" hidden>
      <input id="url-ref" type="url" required placeholder="Link do Reels, TikTok ou Shorts que você quer copiar o formato" autocomplete="off">
      <textarea id="tema" rows="2" maxlength="1500" required placeholder="Sobre o que é o SEU vídeo? Ex.: 3 erros de quem começa a investir"></textarea>
      <div class="linha-op">
        <select id="voz-c" aria-label="Voz do narrador"><option value="feminina">Voz feminina</option><option value="masculina">Voz masculina</option></select>
        <span></span>
        <button class="btn btn-pri" type="submit">Clonar o formato</button>
      </div>
    </form>
    <div id="em-breve" class="em-breve" hidden>Estamos terminando esse modo. Assinantes recebem um e-mail quando ele chegar.</div>
    <div class="msg" id="msg" role="alert"></div>
  </section>
  <section class="lista">
    <h2>Meus pedidos</h2>
    <div id="trabalhos"><div class="vazio">Carregando…</div></div>
  </section>
</main>
<script src="/s/painel.js"></script>
<script>window.TOUR = { chave: 'cortai.tour1', atraso: 1800, passos: [
  { titulo: 'Bem-vindo ao Cortaí', texto: 'Em 1 minuto eu te mostro como transformar vídeos em cortes virais prontos para postar.' },
  { alvo: '.abas', titulo: 'Três jeitos de criar', texto: 'Cortes de um link (YouTube, Instagram, TikTok), animação a partir de um texto, ou clonar o formato de um Reels que bombou.' },
  { alvo: '#url', titulo: 'Cole o link aqui', texto: 'Qualquer vídeo público com alguém falando. O Cortaí assiste, transcreve e acha os momentos que prendem.' },
  { alvo: '#quantos', titulo: 'Quantos cortes', texto: 'Escolha de 1 a 5 cortes por vídeo. Cada um sai vertical, com legenda, gancho no topo e áudio ajustado.' },
  { alvo: '#trabalhos', titulo: 'Seus pedidos', texto: 'Aqui você acompanha o andamento e assiste os cortes prontos. A IA confere cada corte olhando a imagem e refaz o que não ficou bom.' },
  { alvo: '#cota', titulo: 'Seu plano', texto: 'Mostra quantos vídeos você ainda tem no mês. Para ver este tour de novo, clique em Tour.' },
  { titulo: 'Pronto!', texto: 'Cole seu primeiro link e veja a mágica. Use a legenda e as hashtags sugeridas para postar.' },
] }</script>
<script src="/s/tour.js"></script>
</body>
</html>
